<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
/* EARFcoin, drawn: one a guest, good for one song. Cast acrylic in the eight tints, the globe engraved on its face and
   read through the tint, the words round the rim. A drawing, not a render. */
body { width: 1600px; height: 1000px; background: #E7E2DA; display: grid; grid-template-columns: repeat(4, 280px); gap: 60px 80px; justify-content: center; align-content: center }
.coin { position: relative; width: 280px; height: 280px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--t) 70%, white), var(--t) 60%, color-mix(in srgb, var(--t) 75%, black));
  box-shadow: inset 0 0 0 5px rgba(255,255,255,.28), inset 0 0 0 9px color-mix(in srgb, var(--t) 80%, black), 0 26px 30px -16px rgba(0,0,0,.45) }
.coin img { position: absolute; left: 70px; top: 70px; width: 140px; opacity: .55; mix-blend-mode: screen }
.coin svg { position: absolute; inset: 0; width: 100%; height: 100% }
.coin text { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0; fill: rgba(255,255,255,.8) }
.coin[style*="DCE3E4"] text { fill: rgba(28,26,24,.6) } .coin[style*="DCE3E4"] img { mix-blend-mode: multiply; filter: invert(1); opacity: .35 }
</style>
