<text x="816.40" y="68.31" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.60" font-weight="400" fill="#1d1c1a" text-anchor="start">Not reviewed by an architect, an</text>
<text x="816.40" y="72.08" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.60" font-weight="400" fill="#1d1c1a" text-anchor="start">engineer or the building official.</text>
<text x="816.40" y="79.85" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.20" font-weight="600" fill="#8c8984" text-anchor="start" letter-spacing="0.40">SITE (ASSUMED)</text>
<text x="816.40" y="84.85" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.60" font-weight="400" fill="#1d1c1a" text-anchor="start">A typical San Francisco storefront:</text>
<text x="816.40" y="88.62" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.60" font-weight="400" fill="#1d1c1a" text-anchor="start">25'-0" x 80'-0" inside the party walls</text>
<text x="816.40" y="92.39" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.60" font-weight="400" fill="#1d1c1a" text-anchor="start">(2,000 sq ft), 14'-0" to the joists of</text>
<text x="816.40" y="96.16" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.60" font-weight="400" fill="#1d1c1a" text-anchor="start">the flats above, a slab on grade,</text>
<text x="816.40" y="99.93" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.60" font-weight="400" fill="#1d1c1a" text-anchor="start">a glazed front and a rear yard.</text>
<text x="816.40" y="103.70" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.60" font-weight="400" fill="#1d1c1a" text-anchor="start">No site chosen: the scheme is drawn</text>
<text x="816.40" y="107.47" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.60" font-weight="400" fill="#1d1c1a" text-anchor="start">generic and is fitted to the lease.</text>
<text x="816.40" y="115.24" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.20" font-weight="600" fill="#8c8984" text-anchor="start" letter-spacing="0.40">WHAT IT SHOWS</text>
<text x="816.40" y="120.24" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.60" font-weight="400" fill="#1d1c1a" text-anchor="start">The render model itself (kit44), cut so</text>
<text x="816.40" y="124.01" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.60" font-weight="400" fill="#1d1c1a" text-anchor="start">the plan reads from above; the lantern</text>
<text x="816.40" y="127.78" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.60" font-weight="400" fill="#1d1c1a" text-anchor="start">stays whole: the one object.</text>
