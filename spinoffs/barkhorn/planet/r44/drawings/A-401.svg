<text x="816.40" y="57.00" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.60" font-weight="400" fill="#1d1c1a" text-anchor="start">Proposal, not for construction.</text>
<text x="816.40" y="60.77" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.60" font-weight="400" fill="#1d1c1a" text-anchor="start">Every dimension and choice is a working</text>
