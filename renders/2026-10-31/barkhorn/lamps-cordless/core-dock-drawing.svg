<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="980" viewBox="0 0 1900 980"><rect width="1900" height="980" fill="#F4F1EC"/><text x="60.0" y="60.0" font-family="Helvetica, Arial, sans-serif" font-size="22" text-anchor="start" fill="#1C1A18" font-weight="600">Core on its contact dock (CORE-RECHARGE.md, route b): a proposal</text><text x="60.0" y="88.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#8A847A" font-weight="400">Section through the axis (left) and the dock’s plan (right). Millimeters. Core’s CAD unchanged until the owner signs.</text><rect x="325.0" y="757.5" width="750.0" height="32.5" fill="#D9D3C8" stroke="#1C1A18" stroke-width="1.4"/><rect x="325.0" y="750.0" width="70.0" height="7.5" fill="#D9D3C8" stroke="#1C1A18" stroke-width="1.4"/><rect x="1005.0" y="750.0" width="70.0" height="7.5" fill="#D9D3C8" stroke="#1C1A18" stroke-width="1.4"/><rect x="540.0" y="757.5" width="20.0" height="12.5" fill="#B9B7B1" stroke="#1C1A18" stroke-width="1.4"/><rect x="840.0" y="757.5" width="20.0" height="12.5" fill="#B9B7B1" stroke="#1C1A18" stroke-width="1.4"/><rect x="470.0" y="757.5" width="20.0" height="12.5" fill="#B9B7B1" stroke="#1C1A18" stroke-width="1.4"/><rect x="910.0" y="757.5" width="20.0" height="12.5" fill="#B9B7B1" stroke="#1C1A18" stroke-width="1.4"/><rect x="400.0" y="607.5" width="600.0" height="140.0" fill="#3A3836" stroke="#1C1A18" stroke-width="1.4"/><rect x="402.5" y="747.5" width="15.0" height="10.0" fill="#3A3836" stroke="#1C1A18" stroke-width="1.4"/><rect x="982.5" y="747.5" width="15.0" height="10.0" fill="#3A3836" stroke="#1C1A18" stroke-width="1.4"/><rect x="420.0" y="735.0" width="560.0" height="12.5" fill="#5C5955" stroke="#1C1A18" stroke-width="1.4"/><rect x="545.0" y="712.5" width="10.0" height="45.0" fill="#E0B84A" stroke="#1C1A18" stroke-width="1.0"/><rect x="475.0" y="712.5" width="10.0" height="45.0" fill="#E0B84A" stroke="#1C1A18" stroke-width="1.0"/><path d="M 350.0 407.5 A 400.0