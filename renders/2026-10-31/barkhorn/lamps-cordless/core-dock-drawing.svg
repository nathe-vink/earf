Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#1C1A18" font-weight="400">base 30</text><text x="295.0" y="627.5" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#1C1A18" font-weight="400">gold spring pins at r 30 and r 44,</text><text x="295.0" y="643.5" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#1C1A18" font-weight="400">on the 170° line, through the hatch</text><line x1="299.0" y1="623.5" x2="480.0" y2="712.5" stroke="#1C1A18" stroke-width="0.8"/><text x="700.0" y="672.5" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#F2EEE8" font-weight="400">Core’s base 120 × 30: cells, chassis, ballast (unchanged)</text><text x="700.0" y="864.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1C1A18" font-weight="400">the dock: polished black cast acrylic, two 304 stainless rings pressed in flush</text><text x="700.0" y="377.5" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#8A847A" font-weight="400">the ball (unchanged)</text><circle cx="1560" cy="480" r="232.5" fill="#2A2927" stroke="#1C1A18" stroke-width="1.4"/><circle cx="1560" cy="480" r="189.1" fill="#232220" stroke="#6B6761" stroke-width="1"/><circle cx="1560" cy="480" r="93.0" fill="none" stroke="#C9C7C1" stroke-width="12.4"/><circle cx="1560" cy="480" r="136.4" fill="none" stroke="#C9C7C1" stroke-width="12.4"/><rect x="1547.6" y="246.5" width="24.8" height="18.6" fill="#FFFFFF" stroke="#1C1A18" stroke-width="1.0"/><line x1="1560.0" y1="246.5" x2="1560.0" y2="177.5" stroke="#141414" stroke-width="4.0"/><line x1="1423.6" y1="738.5" x2="1696.4" y2="738.5" stroke="#1C1A18" stroke-width="0.9"/><line x1="1423.6" y1="733.5" x2="1423.6" y2="743.5" stroke="#1C1A18" stroke-width="0.9"/><line x1="1696.4" y1="733.5" x2="1696.4" y2="743.5" stroke="#1C1A18" stroke-width="0.9"/><text x="1560.0" y="732.5" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1C1A18" font-weight="400">− ring Ø88 (4 wide)</text><line x1="1467.0" y1="762.5" x2="1653.0" y2="762.5" stroke="#1C1A18" stroke-width="0.9"/><line x1="1467.0" y1="757.5" x2="1467.0" y2="767.5" stroke="#1C1A18" stroke-width="0.9"/><line x1="1653.0" y1="757.5" x2="1653.0" y2="767.5" stroke="#1C1A18" stroke-width="0.9"/><text x="1560.0" y="756.5" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1C1A18" font-weight="400">+ ring Ø60 (4 wide)</text><text x="1560.0" y="792.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1C1A18" font-weight="400">concentric: Core charges at any rotation</text><text x="1568.0" y="195.5" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#8A847A" font-weight="400">back</text><text x="60.0" y="940.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#8A847A" font-weight="400">Off the dock the pins are dead (an ideal diode on each input); the rings are powered only when the dock sees the lamp’s 47 kΩ sense resistor.</text></svg>